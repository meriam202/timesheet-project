version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-timesheet
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: timesheetdb
    volumes:
      - timesheetvol:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    image: timesheet-meriam-4nids2
    container_name: app-timesheet
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/timesheetdb?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
    ports:
      - "8082:8082"

volumes:
  timesheetvol:
